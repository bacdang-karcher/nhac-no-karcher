<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Reminder & Email Generator - Kärcher Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS (Thư viện đọc file Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        karcher: { yellow: '#FFED00', darkyellow: '#e6d500', black: '#212121' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-karcher-black text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-karcher-yellow text-karcher-black font-extrabold px-3 py-1 rounded text-lg">KÄRCHER</div>
                <h1 class="text-lg font-semibold border-l border-slate-700 pl-3 text-slate-200 hidden sm:block">
                    Công cụ Quản lý & Nhắc nợ Công nợ Quá hạn
                </h1>
            </div>
            <div class="flex items-center space-x-2">
                <!-- NÚT TẢI FILE EXCEL/CSV MỚI THÊM -->
                <label class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-semibold cursor-pointer transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-file-import"></i>
                    <span>Tải file Excel/CSV</span>
                    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)" class="hidden">
                </label>
                <button onclick="exportToCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-600 transition flex items-center gap-2">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i>
                    <span>Xuất CSV</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Content Table & Preview Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="Tìm theo Mã KH, Tên KH, Số HĐ..." class="w-full p-2 border rounded-lg text-sm">
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex-grow">
                <div class="p-3.5 bg-slate-50 border-b flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-700 uppercase">Danh sách công nợ (<span id="rowCount">0</span>)</h2>
                </div>
                <div class="overflow-auto max-h-[500px]">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 text-slate-600 uppercase font-semibold sticky top-0">
                            <tr>
                                <th class="p-2.5 text-center"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
                                <th class="p-2.5">Code</th>
                                <th class="p-2.5">Khách hàng</th>
                                <th class="p-2.5">Hợp đồng</th>
                                <th class="p-2.5 text-right">Còn lại (VND)</th>
                            </tr>
                        </thead>
                        <tbody id="debtTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Preview Email -->
        <section class="lg:col-span-5">
            <div class="bg-white rounded-xl shadow-sm border p-4">
                <h2 class="font-bold text-sm mb-2"><i class="fa-solid fa-envelope-open-text text-amber-500"></i> Xem trước Email</h2>
                <div id="emailPreviewContent" class="text-xs border p-3 rounded bg-slate-50 max-h-[500px] overflow-y-auto">
                    Chưa có dữ liệu. Vui lòng chọn khoản nợ hoặc tải tệp lên.
                </div>
                <button onclick="copyEmailHTML()" class="w-full mt-3 bg-karcher-yellow text-karcher-black font-bold py-2 rounded shadow">
                    Sao chép Nội dung Email
                </button>
            </div>
        </section>
    </main>

    <script>
        let debtData = [];

        // Hàm đọc File Excel/CSV từ Fast
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                debtData = [];
                // Quét từ dòng 3 (index 2) bỏ qua tiêu đề file Fast
                for (let i = 2; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (row && row[4]) { // Kiểm tra có Mã KH
                        debtData.push({
                            code: row[4] || '',
                            customer: row[5] || '',
                            salesman: row[16] || '',
                            codeSalesman: row[15] || '',
                            dept: 'SALES',
                            contractNo: row[6] || row[3] || '',
                            afterTax: Number(row[7]) || 0,
                            balanceAmount: Number(row[9]) || Number(row[7]) || 0,
                            invoiceNo: row[3] || '',
                            email: row[17] || '',
                            selected: true
                        });
                    }
                }
                renderTable();
                alert("Đã tải tệp công nợ thành công!");
            };
            reader.readAsArrayBuffer(file);
        }

        function formatVND(amt) { return new Intl.NumberFormat('vi-VN').format(amt); }

        function renderTable() {
            const tbody = document.getElementById('debtTableBody');
            tbody.innerHTML = '';
            debtData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2.5 text-center"><input type="checkbox" ${item.selected ? 'checked' : ''} onchange="toggleSelect(${index})"></td>
                    <td class="p-2.5 font-medium">${item.code}</td>
                    <td class="p-2.5 font-semibold">${item.customer}</td>
                    <td class="p-2.5">${item.contractNo}</td>
                    <td class="p-2.5 text-right font-bold text-red-600">${formatVND(item.balanceAmount)}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('rowCount').textContent = debtData.length;
            updateEmailPreview();
        }

        function toggleSelect(index) {
            debtData[index].selected = !debtData[index].selected;
            renderTable();
        }

        function toggleSelectAll(master) {
            debtData.forEach(item => item.selected = master.checked);
            renderTable();
        }

        function updateEmailPreview() {
            const selected = debtData.filter(d => d.selected);
            const container = document.getElementById('emailPreviewContent');
            if (selected.length === 0) {
                container.innerHTML = "Vui lòng chọn ít nhất 1 khoản nợ.";
                return;
            }
            let total = selected.reduce((s, i) => s + i.balanceAmount, 0);
            container.innerHTML = `
                <p><b>Kính gửi Quý Công ty,</b></p>
                <p>Cảm ơn Quý khách đã hợp tác cùng KÄRCHER. Chi tiết công nợ quá hạn như sau:</p>
                <table border="1" style="width:100%; border-collapse:collapse; margin:10px 0;">
                    <tr style="background:#FFED00;"><th>Code</th><th>Customer</th><th>Contract</th><th>Balance</th></tr>
                    ${selected.map(i => `<tr><td>${i.code}</td><td>${i.customer}</td><td>${i.contractNo}</td><td align="right">${formatVND(i.balanceAmount)}</td></tr>`).join('')}
                    <tr style="background:#FFED00; font-weight:bold;"><td colspan="3">TỔNG NỢ</td><td align="right" style="color:red;">${formatVND(total)}</td></tr>
                </table>
            `;
        }

        function copyEmailHTML() {
            const range = document.createRange();
            range.selectNode(document.getElementById('emailPreviewContent'));
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            alert("Đã sao chép nội dung Email!");
        }
    </script>
</body>
</html>
